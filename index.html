<h2>🔐 ما هي المصادقة الثنائية؟</h2>

<p>
المصادقة الثنائية، أو 2FA، هي طريقة تضيف خطوة أمان إضافية عند تسجيل الدخول إلى الحساب. بدل الاعتماد على كلمة المرور وحدها، يطلب الموقع وسيلة تحقق ثانية تثبت أنك صاحب الحساب.

</p>


<h2>⭐ لماذا هي مهمة؟</h2>

<p>
كلمات المرور يمكن أن تتعرض للتصيد أو التسريب أو إعادة الاستخدام في أكثر من موقع. لذلك فإن إضافة عامل ثانٍ تقلل من خطر الدخول غير المصرح به.
</p>


<h2>⚙️ كيف تعمل؟</h2>

<ul>

<li>
تدخل اسم المستخدم وكلمة المرور.
</li>

<li>
يطلب منك الموقع خطوة تحقق إضافية.
</li>

<li>
تستخدم وسيلة التحقق المتاحة لك.
</li>

<li>
بعد نجاح التحقق يسمح لك الموقع بالدخول.
</li>

</ul>


<h2>📱 أمثلة على عوامل التحقق</h2>

<ul>

<li>تطبيق مصادقة.</li>

<li>رمز يصل عبر الهاتف.</li>

<li>مفتاح أمان.</li>

<li>وسيلة تحقق بيومترية حسب الخدمة والجهاز.</li>

</ul>


<div class="warning">

🚨 لا تشارك رموز التحقق مع أي شخص، حتى لو ادعى أنه موظف دعم.

</div>


<h2>❌ أخطاء شائعة</h2>

<ul>

<li>إعطاء رمز التحقق لشخص آخر.</li>

<li>الموافقة على طلب تسجيل دخول لم تبدأه أنت.</li>

<li>عدم الاحتفاظ بوسيلة استرداد مناسبة.</li>

</ul>


<div class="tip">

💡 نصيحة سند: فعّل 2FA خصوصاً للحسابات المهمة مثل البريد الإلكتروني والحسابات التي تحتوي على معلومات شخصية.

</div>

<h2>✅ الخلاصة</h2>

<p>

/* =====================================
عرض المواضيع
===================================== */

function renderArticles(list=articles){

const grid=document.getElementById("grid");

grid.innerHTML="";

if(list.length===0){

grid.innerHTML=`

<div class="info">

🔎 ما لقيتش المعلومة اللي تبحث عليها.

</div>

`;

return;

}

list.forEach(article=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="card-icon">
${article.icon}
</div>

<div class="card-content">

<h3>
${article.id}. ${article.title}
</h3>

<p>
${article.short}
</p>

<button
class="read-btn"
onclick="openArticle(${article.id})">

📖 اقرأ الشرح الكامل

</button>

</div>

`;

grid.appendChild(card);

});

}


/* =====================================
فتح المقال
===================================== */

function openArticle(id){

const article=articles.find(
item=>item.id===id
);

if(!article)return;

document.getElementById("homePage").style.display="none";

document.getElementById("articlePage").style.display="block";

document.getElementById("articleContent").innerHTML=`

<div class="article-icon">

${article.icon}

</div>

<h1>

${article.id}. ${article.title}

</h1>

<p>

<strong>
${article.short}
</strong>

</p>

${article.content}

<div class="info">

📚 أنت الآن تقرأ من موسوعة
<strong>SANAD CYBER</strong>
للأمن الرقمي.

</div>

`;

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================
الرجوع
===================================== */

function goHome(){

document.getElementById("articlePage").style.display="none";

document.getElementById("homePage").style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================
البحث
===================================== */

function searchArticles(){

const value=
document.getElementById("search")
.value
.toLowerCase()
.trim();

if(value===""){

renderArticles();

return;

}

const results=articles.filter(article=>{

const text=(
article.title+
" "+
article.short+
" "+
article.content
).toLowerCase();

return text.includes(value);

});

renderArticles(results);

}


/* =====================================
التصنيفات
===================================== */

function filterCategory(category){

if(category==="all"){

renderArticles();

return;

}

const results=articles.filter(
article=>article.category===category
);

renderArticles(results);

}


/* =====================================
الوضع الليلي والفاتح
===================================== */

function toggleTheme(){

document.body.classList.toggle("light");

const mode=
document.body.classList.contains("light")
?"light"
:"dark";

localStorage.setItem(
"sanadTheme",
mode
);

}


/* =====================================
حفظ الوضع
===================================== */

if(
localStorage.getItem("sanadTheme")
==="light"
){

document.body.classList.add("light");

}


/* =====================================
تشغيل الموقع
===================================== */

renderArticles();

</script>
